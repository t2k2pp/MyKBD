<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262b"/>
      <stop offset="50%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef233c"/>
      <stop offset="100%" stop-color="#b8001f"/>
    </linearGradient>
    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051017"/>
      <stop offset="100%" stop-color="#01070a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Background for Safe Zone & Maskable Compatibility -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#0f1013"/>

  <!-- Device Silhouette -->
  <rect x="40" y="60" width="432" height="392" rx="20" fill="url(#bodyGrad)" stroke="#383c45" stroke-width="3"/>

  <!-- Red Accent Cheek Bottom/Sides -->
  <path d="M 40 430 L 40 440 C 40 450 48 452 60 452 L 452 452 C 464 452 472 450 472 440 L 472 430 Z" fill="url(#redAccent)"/>
  <rect x="40" y="60" width="6" height="370" fill="url(#redAccent)" opacity="0.9"/>
  <rect x="466" y="60" width="6" height="370" fill="url(#redAccent)" opacity="0.9"/>

  <!-- Brand Text -->
  <text x="65" y="96" fill="#ef233c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="2">STUDIO</text>
  <text x="145" y="96" fill="#f0f3f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="1">SYNTH</text>

  <!-- Joystick (Left) -->
  <circle cx="85" cy="155" r="28" fill="#121316" stroke="#2c3038" stroke-width="2"/>
  <circle cx="85" cy="155" r="16" fill="url(#redAccent)" filter="url(#glow)"/>
  <circle cx="85" cy="155" r="6" fill="#ff6b6b"/>

  <!-- OLED Display (Center-Left) -->
  <rect x="135" y="125" width="130" height="60" rx="4" fill="url(#oledGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="145" y="148" fill="#00e5ff" font-family="monospace" font-weight="bold" font-size="12">001:GrandPiano</text>
  <text x="145" y="165" fill="#00e5ff" font-family="monospace" font-size="10">OCT:0  BPM:120</text>
  <rect x="145" y="172" width="80" height="4" rx="2" fill="#004a55"/>
  <rect x="145" y="172" width="48" height="4" rx="2" fill="#00e5ff"/>

  <!-- 4 Knobs (Center) -->
  <circle cx="295" cy="140" r="14" fill="#202227" stroke="#454b57" stroke-width="2"/>
  <line x1="295" y1="140" x2="295" y2="130" stroke="#ef233c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="335" cy="140" r="14" fill="#202227" stroke="#454b57" stroke-width="2"/>
  <line x1="335" y1="140" x2="343" y2="134" stroke="#ef233c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="295" cy="175" r="14" fill="#202227" stroke="#454b57" stroke-width="2"/>
  <line x1="295" y1="175" x2="288" y2="170" stroke="#ef233c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="335" cy="175" r="14" fill="#202227" stroke="#454b57" stroke-width="2"/>
  <line x1="335" y1="175" x2="340" y2="182" stroke="#ef233c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Built-in Speaker Grill (Top Right) -->
  <g fill="#2c3038">
    <circle cx="400" cy="130" r="2.5"/><circle cx="415" cy="130" r="2.5"/><circle cx="430" cy="130" r="2.5"/><circle cx="445" cy="130" r="2.5"/>
    <circle cx="392" cy="142" r="2.5"/><circle cx="407" cy="142" r="2.5"/><circle cx="422" cy="142" r="2.5"/><circle cx="437" cy="142" r="2.5"/><circle cx="452" cy="142" r="2.5"/>
    <circle cx="400" cy="154" r="2.5"/><circle cx="415" cy="154" r="2.5"/><circle cx="430" cy="154" r="2.5"/><circle cx="445" cy="154" r="2.5"/>
    <circle cx="392" cy="166" r="2.5"/><circle cx="407" cy="166" r="2.5"/><circle cx="422" cy="166" r="2.5"/><circle cx="437" cy="166" r="2.5"/><circle cx="452" cy="166" r="2.5"/>
  </g>

  <!-- 8 Performance Drum Pads (2 rows of 4) -->
  <g>
    <!-- Row 1 -->
    <rect x="65" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#ef233c" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="115" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#3d434f" stroke-width="1"/>
    <rect x="165" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#3d434f" stroke-width="1"/>
    <rect x="215" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#ef233c" stroke-width="1.5" filter="url(#glow)"/>

    <rect x="265" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#3d434f" stroke-width="1"/>
    <rect x="315" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="365" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#3d434f" stroke-width="1"/>
    <rect x="415" y="210" width="42" height="42" rx="4" fill="#23262d" stroke="#3d434f" stroke-width="1"/>
  </g>

  <!-- Keyboard Bed (25 Keys representation) -->
  <rect x="60" y="275" width="392" height="150" rx="6" fill="#15171a" stroke="#2e323b" stroke-width="2"/>
  <!-- White Keys -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1">
    <rect x="64" y="278" width="23" height="142" rx="3"/>
    <rect x="89" y="278" width="23" height="142" rx="3"/>
    <rect x="114" y="278" width="23" height="142" rx="3"/>
    <rect x="139" y="278" width="23" height="142" rx="3"/>
    <rect x="164" y="278" width="23" height="142" rx="3"/>
    <rect x="189" y="278" width="23" height="142" rx="3"/>
    <rect x="214" y="278" width="23" height="142" rx="3"/>
    <rect x="239" y="278" width="23" height="142" rx="3"/>
    <rect x="264" y="278" width="23" height="142" rx="3"/>
    <rect x="289" y="278" width="23" height="142" rx="3"/>
    <rect x="314" y="278" width="23" height="142" rx="3"/>
    <rect x="339" y="278" width="23" height="142" rx="3"/>
    <rect x="364" y="278" width="23" height="142" rx="3"/>
    <rect x="389" y="278" width="23" height="142" rx="3"/>
    <rect x="414" y="278" width="23" height="142" rx="3"/>
  </g>
  <!-- Black Keys -->
  <g fill="#1a1d21" stroke="#0a0b0d" stroke-width="1">
    <rect x="80" y="278" width="15" height="92" rx="2"/>
    <rect x="105" y="278" width="15" height="92" rx="2"/>
    <rect x="155" y="278" width="15" height="92" rx="2"/>
    <rect x="180" y="278" width="15" height="92" rx="2"/>
    <rect x="205" y="278" width="15" height="92" rx="2"/>
    <rect x="255" y="278" width="15" height="92" rx="2"/>
    <rect x="280" y="278" width="15" height="92" rx="2"/>
    <rect x="330" y="278" width="15" height="92" rx="2"/>
    <rect x="355" y="278" width="15" height="92" rx="2"/>
    <rect x="380" y="278" width="15" height="92" rx="2"/>
  </g>
</svg>
